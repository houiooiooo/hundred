<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>百謙｜生活資料庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f2;color:#222;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{background:white;padding:20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}header b{font:26px Georgia,serif;letter-spacing:3px}nav{display:flex;overflow:auto;gap:6px;padding:12px;background:white;border-bottom:1px solid #ddd}button{font:inherit;cursor:pointer;border:1px solid #cbd5cd;border-radius:8px;background:white;color:#2b4836;padding:11px 15px;white-space:nowrap}button.active,.primary{background:#2b4836;color:white}main{max-width:900px;margin:auto;padding:22px 16px 80px}h1{font:30px Georgia,serif;margin:10px 0}small,.muted{color:#777;font-size:13px}input,textarea{width:100%;font:inherit;padding:13px;border:1px solid #ddd;border-radius:8px;background:white}textarea{height:240px;font:12px monospace}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.card{background:white;border:1px solid #e2e3df;border-radius:12px;margin:12px 0;padding:18px;overflow-wrap:anywhere}.card p{font-size:13px;color:#666;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats .card{margin:0}.stat{font-size:24px;font-weight:600;margin-top:10px}.item{border-top:1px solid #eee;padding:13px 0}.item:first-child{border-top:0}.item strong{font-weight:600}.item small{display:block;margin-top:5px;line-height:1.6}.item button{padding:5px 9px;font-size:12px;margin-top:7px}#tabs{display:flex;gap:6px;overflow:auto;padding:12px 0}#tabs button{font-size:13px}.note{background:#eaf0e9;border:1px solid #d6e0d5;border-radius:10px;padding:18px;line-height:1.8}.hidden{display:none}@media(min-width:760px){main{padding-top:35px}.stats{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><b>百謙</b><small>生活資料庫 · 私人本機資料</small></header><nav id="nav"></nav><main><h1 id="heading">生活總覽</h1><p class="muted" id="sub">七個生活資料庫</p><div id="welcome" class="note">此網站不會把你的備份上傳至伺服器。首次使用請匯入 Claude 的 JSON 備份，資料會保存在目前瀏覽器。換裝置或清除網站資料前，請先匯出備份。</div><div class="bar"><button class="primary" id="import">匯入 Claude JSON</button><button id="export">匯出資料</button><button id="add">新增紀錄</button></div><input id="query" placeholder="搜尋紀錄" aria-label="搜尋"><div id="stats" class="stats"></div><div id="tabs"></div><div id="content"></div><div class="bar" id="paging"></div><p class="muted">資料只儲存於本裝置瀏覽器，不與 Google Drive 或 Claude 自動同步。公開網站只包含程式碼，不包含個人備份。</p></main><input type="file" id="file" accept=".json,application/json" hidden><script>
const names=['帳','健身','查理','送餐','刺青','日記','百千報'],key='baiqian_official_data_1';let db=null,view='總覽',section='',page=0;try{db=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){alert('本機儲存失敗，請先匯出資料。')}}function docs(){return db?.pages?.[view]?.docs||{}}function records(v,path=[],out=[]){if(Array.isArray(v)){v.forEach((x,i)=>records(x,[...path,i],out));return out}if(v&&typeof v==='object'){if(['n','text','title','t','a','date','content','note'].some(k=>k in v)){out.push({path,r:v});return out}Object.entries(v).forEach(([k,x])=>records(x,[...path,k],out));return out}if(v!==null&&v!==undefined&&String(v).length>2)out.push({path,r:{n:String(v)}});return out}function at(obj,path){return path.reduce((x,k)=>x?.[k],obj)}function set(obj,path,val){at(obj,path.slice(0,-1))[path.at(-1)]=val}function change(n){view=n;section='';page=0;$('query').value='';render()}function format(t){if(!t)return '';let d=new Date(t);return isNaN(d)?String(t):d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}function render(){ $('nav').innerHTML=['總覽',...names].map(n=>'<button class="'+(view===n?'active':'')+'" data-nav="'+n+'">'+n+'</button>').join('');$('heading').textContent=view==='總覽'?'生活總覽':view;$('welcome').classList.toggle('hidden',!!db);$('add').disabled=!db;$('export').disabled=!db;$('tabs').innerHTML='';$('stats').innerHTML='';$('paging').innerHTML='';if(!db){$('content').innerHTML='<div class="card"><h2>開始使用</h2><p>匯入 Claude 的「頁面備份_日期.json」，即可開啟七個頁面。你的財務、日記及健康資料不會被發佈到 GitHub。</p></div>';return}let q=$('query').value.toLowerCase().trim();if(view==='總覽'){let found=[];if(q)for(let n of names)for(let x of records(db.pages[n].docs))if(JSON.stringify(x.r).toLowerCase().includes(q))found.push({...x,origin:n});$('stats').innerHTML=names.map(n=>'<div class="card"><small>'+n+'</small><div class="stat">'+records(db.pages[n].docs).length+'</div></div>').join('');$('content').innerHTML=q?list(found.slice(0,100)):names.map(n=>'<div class="card"><strong>'+n+'</strong><p>'+Object.keys(db.pages[n].docs).length+' 個資料區塊</p><button data-nav="'+n+'">開啟</button></div>').join('');return}let keys=Object.keys(docs());if(!keys.includes(section))section=keys[0];$('tabs').innerHTML=keys.map((k,i)=>'<button data-tab="'+i+'" class="'+(section===k?'active':'')+'">'+escape(k)+'</button>').join('');let items=records(docs()[section]).filter(x=>!q||JSON.stringify(x.r).toLowerCase().includes(q));items.sort((a,b)=>(Number(b.r.t)||0)-(Number(a.r.t)||0));$('stats').innerHTML='<div class="card"><small>目前區塊</small><div class="stat">'+items.length+'</div></div><div class="card"><small>資料區塊</small><div class="stat">'+keys.length+'</div></div>';$('content').innerHTML=list(items.slice(page*60,(page+1)*60));$('paging').innerHTML=(items.length>60?'<button id="prev">上一頁</button><small>第 '+(page+1)+' / '+Math.ceil(items.length/60)+' 頁</small><button id="next">下一頁</button>':'')}function list(items){return '<div class="card">'+(items.length?items.map((x,i)=>{let r=x.r;return '<div class="item"><strong>'+escape(String(r.n||r.title||r.text||r.date||r.content||r.note||x.path.at(-1)||'紀錄').slice(0,300))+'</strong><small>'+escape(format(r.t))+' '+(typeof r.a==='number'?' · NT$ '+r.a.toLocaleString():'')+'</small><button data-record="'+i+'">完整資料 / 編輯</button></div>'}).join(''):'<p>沒有符合條件的資料。</p>')+'</div>'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){change(b.dataset.nav);return}if(b.dataset.tab!==undefined){section=Object.keys(docs())[Number(b.dataset.tab)];page=0;render();return}if(b.id==='prev'||b.id==='next'){page=Math.max(0,page+(b.id==='prev'?-1:1));render();return}if(b.dataset.record!==undefined){let q=$('query').value.toLowerCase().trim(),items=view==='總覽'?names.flatMap(n=>records(db.pages[n].docs).filter(x=>JSON.stringify(x.r).toLowerCase().includes(q)).map(x=>({...x,origin:n}))):records(docs()[section]).filter(x=>!q||JSON.stringify(x.r).toLowerCase().includes(q)).sort((a,b)=>(Number(b.r.t)||0)-(Number(a.r.t)||0)).slice(page*60,(page+1)*60);let x=items[Number(b.dataset.record)];if(!x)return;let target=db.pages[x.origin||view].docs,raw=prompt('編輯這筆紀錄的 JSON（取消則不修改）',JSON.stringify(x.r,null,2));if(raw!==null){try{set(target,x.path,JSON.parse(raw));save();render()}catch(err){alert('JSON 格式錯誤：'+err.message)}}}});$('query').oninput=()=>{page=0;render()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d.pages||!names.every(n=>d.pages[n]?.docs))throw Error('不是支援的七頁 Claude 備份');if(db&&!confirm('新備份將取代目前本機資料，請先匯出舊資料。繼續？'))return;db=d;save();change('總覽')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};$('export').onclick=()=>{if(!db)return;let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='百謙_備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('add').onclick=()=>{if(!db)return;if(view==='總覽'){change('帳');return}let name=prompt('新增紀錄內容');if(!name?.trim())return;let d=docs(),paths=[];function find(o,p=[],depth=0){if(depth>3||!o||typeof o!=='object')return;if(Array.isArray(o)){if(['entries','sessions','shifts','fuel','repairs','projects'].includes(String(p.at(-1))))paths.push(p);return}for(let [k,v]of Object.entries(o))find(v,[...p,k],depth+1)}find(d);if(!paths.length){alert('這個區塊沒有可直接新增的紀錄清單。');return}let path=paths.find(p=>p.includes('2026-11'))||paths[0],r={id:'local_'+Date.now(),n:name.trim(),t:Date.now()};if(view==='帳'){let amount=prompt('金額（新台幣）','0');if(amount===null)return;r.a=Number(amount)||0;r.k=confirm('這筆是收入嗎？按取消代表支出。')?'in':'out'}at(d,path).push(r);save();section=path[0];render()};render();
</script></body></html>
