<script>
/* 日夜：依台北日出日落自動切換；按「日」「夜」手動切換，維持到下一次日出或日落 */
(function(){
  var LAT=25.04, LON=121.56, R=Math.PI/180;
  function sun(dayMs){ // dayMs: 該日任一時刻；回傳 [日出ms, 日落ms]
    var jd=Math.floor((dayMs+28800000)/86400000)+2440588;
    var n=Math.ceil(jd-2451545.0+0.0008), js=n-LON/360;
    var M=(357.5291+0.98560028*js)%360, C=1.9148*Math.sin(M*R)+0.02*Math.sin(2*M*R)+0.0003*Math.sin(3*M*R);
    var L=(M+C+180+102.9372)%360, jt=2451545+js+0.0053*Math.sin(M*R)-0.0069*Math.sin(2*L*R);
    var d=Math.asin(Math.sin(L*R)*Math.sin(23.4397*R));
    var w=Math.acos((Math.sin(-0.833*R)-Math.sin(LAT*R)*Math.sin(d))/(Math.cos(LAT*R)*Math.cos(d)))/R;
    var ms=function(j){return (j-2440587.5)*86400000;};
    return [ms(jt-w/360), ms(jt+w/360)];
  }
  function state(now){
    var t=sun(now), r=t[0], s=t[1];
    if(now<r){ var y=sun(now-86400000); if(now<y[1]) return {day:true,next:y[1]}; return {day:false,next:r}; }
    if(now<s) return {day:true,next:s};
    return {day:false,next:sun(now+86400000)[0]};
  }
  function get(){ try{ return JSON.parse(localStorage.getItem('hundred-mode')||'null'); }catch(e){ return null; } }
  function put(v){ try{ localStorage.setItem('hundred-mode',JSON.stringify(v)); }catch(e){} }
  function apply(){
    var now=Date.now(), st=state(now), o=get(), day=st.day;
    if(o && now<o.until) day=(o.m==='day'); else if(o) put(null);
    document.documentElement.classList.toggle('dark',!day);
    var b=document.getElementById('modebtn');
    if(b){ b.textContent=day?'日':'夜'; b.setAttribute('aria-label',day?'目前日間，按一下切換到夜間':'目前夜間，按一下切換到日間'); }
    window.hundredDay=day;
  }
  window.hundredMode=function(m){ if(m==='toggle') m=window.hundredDay?'night':'day'; put({m:m,until:state(Date.now()).next}); apply(); };
  apply();
  document.addEventListener('DOMContentLoaded',function(){ apply(); setInterval(apply,60000); });
})();
</script>

<script>
(function(){
  const deck = document.getElementById('deck'), bars = document.getElementById('bars'), issueEl = document.getElementById('issue');
  let list = [], cur = null, cache = {};
  const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paras = s => String(s ?? '').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p>'+esc(p).replace(/\n/g,'<br>').replace(/\[(\d{1,2})\]/g,'<sup class="fn">$1</sup>')+'</p>').join('');
  const bodyHtml = s => {
    const ps = String(s ?? '').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    const i = ps.findIndex(p => /^背景｜/.test(p));
    if(i < 0) return '<div class="body">'+paras(s)+'</div>';
    const head = esc(ps[i]).replace(/\[(\d{1,2})\]/g,'<sup class="fn">$1</sup>');
    return '<div class="body">'+paras(ps.slice(0,i).join('\n\n'))+'</div><aside class="bg"><div class="bgt">'+head+'</div><div class="body">'+paras(ps.slice(i+1).join('\n\n'))+'</div></aside>';
  };
  const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : null;
  function when(x){
    const p = x.published ? new Date(x.published) : null;
    if(!p || isNaN(p)) return x.date || '';
    const t = new Date(p.getTime() + (8*60 + p.getTimezoneOffset())*60000); // 台北時間
    return (t.getMonth()+1)+'月'+t.getDate()+'日 '+WD[t.getDay()]+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  }
  let curId = '';
  // 單篇網址與標籤（每篇都有自己的頁面 a/<期>-<欄>.html；欄位標籤由 tools/build_news_pages.py 產生，這裡只列主題標籤）
  const metaHtml = (o, key) => (curId && key && o.title) ? '<div class="meta"><button type="button" class="sh" data-t="'+esc(o.title+'｜百千報')+'" data-u="'+esc(new URL('a/'+curId+'-'+key+'.html', location.href).href.split('#')[0])+'" aria-label="分享" title="分享"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"/></svg></button><button type="button" class="sh ig" data-u="'+esc(new URL('a/'+curId+'-'+key+'.html', location.href).href.split('#')[0])+'" data-img="og/s/'+esc(curId)+'-'+esc(key)+'.jpg" data-name="'+esc(curId)+'-'+esc(key)+'.jpg" aria-label="分享到 IG 限動" title="分享到 IG 限動"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3.2 2.4"/><path d="M12 8v8M8 12h8"/></svg></button><a href="a/'+esc(curId)+'-'+esc(key)+'.html">單篇網址</a>'+(Array.isArray(o.tags)?o.tags.map(t=>'<a href="t/'+encodeURIComponent(t)+'.html">#'+esc(t)+'</a>').join(''):'')+'<span class="shm"></span></div>' : '';
  // 分享：手機叫出系統分享選單（Threads、IG、LINE…）；不支援時複製連結
  document.addEventListener('click', async e => {
    const b = e.target.closest && e.target.closest('button.sh:not(.ig)'); if(!b) return;
    const t = b.dataset.t, u = b.dataset.u, m = b.parentNode.querySelector('.shm');
    if(navigator.share){ try{ await navigator.share({title:t, text:t, url:u}); return; }catch(err){ if(err && err.name === 'AbortError') return; } }
    try{ await navigator.clipboard.writeText(t+' '+u); if(m) m.textContent = '已複製連結'; }catch(err){ window.prompt('複製這個連結', u); }
    setTimeout(() => { if(m) m.textContent = ''; }, 2500);
  });
  function card(label, sub, o, key){
    if(!o) return null;
    if(o.tag) label = o.tag; if(o.sub != null) sub = o.sub; // 特輯可在欄位裡改卡片標籤
    let h = '<div class="tag"><b>'+esc(label)+'</b><span>'+esc(sub||'')+'</span></div>';
    if(o.title) h += '<h2>'+esc(o.title)+'</h2>';
    if(o.target) h += '<div class="target">'+esc(o.target)+'</div>';
    if(o.pre) h += '<aside class="pre"><div class="pret">讀前｜這篇在說什麼</div>'+paras(o.pre)+'</aside>'; // 讀前小卡（2026-11-18 試行）
    h += bodyHtml(o.body);
    if(o.question) h += '<div class="q">'+esc(o.question)+'</div>';
    if(Array.isArray(o.notes) && o.notes.length)
      h += '<details class="notes"><summary>附註（'+o.notes.length+'）</summary><ol>'+o.notes.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></details>';
    const u = o.source && safeUrl(o.source.url);
    if(u) h += '<div class="src">來源：<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(o.source.title||u)+'</a></div>';
    h += metaHtml(o, key);
    return {label, html:h};
  }
/* 分享到 IG 限動：複製這篇的網址，再把直式限動圖交給手機的分享選單（選 Instagram → 限時動態，再加「連結」貼紙貼上網址）。
     手機不支援分享圖片時，改成下載圖片＋複製網址。圖先預載，點下去才不會因為等下載而被瀏覽器擋掉。 */
    (function(){
    var cache = {};
    function load(src){ if(!cache[src]) cache[src] = fetch(src).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){ cache[src+'#b'] = b; return b; }); return cache[src]; }
    window.hundredStoryPreload = function(root){ (root||document).querySelectorAll('button.ig').forEach(function(b){ load(b.dataset.img).catch(function(){}); }); };
    document.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('button.ig'); if(!b) return;
      var u = b.dataset.u, src = b.dataset.img, name = b.dataset.name || 'hundred-story.jpg';
      var m = b.parentNode.querySelector('.shm');
      var say = function(t){ if(m){ m.textContent = t; clearTimeout(m._t); m._t = setTimeout(function(){ m.textContent=''; }, 6000); } };
      try{ navigator.clipboard.writeText(u); }catch(err){}
      var blob = cache[src+'#b'];
      if(!blob){ say('圖片準備中，請再按一次'); load(src).then(function(){ say('準備好了，再按一次'); }).catch(function(){ say('圖片載入失敗'); }); return; }
      var file = new File([blob], name, {type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        say('網址已複製：選 Instagram →「限時動態」，再加「連結」貼紙貼上');
        navigator.share({files:[file]}).catch(function(err){ if(!err || err.name !== 'AbortError') say('沒分享出去，可以再試一次'); });
      } else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
        say('已下載限動圖，網址也複製好了');
      }
    });
  })();
  
  const INTRO = '<div class="tag"><b>楔子</b><span>關於百千報</span></div><div class="body">'+
    '<p>百千報是一個小小的嘗試：用一份報紙，換掉醒來和睡前滑手機的那段時間。</p>'+
    '<p>社群媒體很懂我們喜歡什麼，一滑就停不下來，看到的多半是本來就同意的東西。我們也一樣。</p>'+
    '<p>所以百千報挑一些你可能沒聽過、不一定同意，或從沒想過的東西，放在一起讀。它可能挑錯，也可能寫錯，歡迎寫信來指正。</p>'+
    '<p>每期固定有：</p><ul>'+
    '<li><b>新聞</b>：一件值得知道的事。問題照實寫，也寫誰在回應、有沒有用。</li>'+
    '<li><b>反方</b>：挑一個常見的信念，整理反對它的理由，也講支持的一方怎麼回應。</li>'+
    '<li><b>意識科學</b>：一堂連載的課，問意識是什麼。</li>'+
    '<li><b>刺青</b>：傳統、工具、方法與身體，每期一個具體的細節。</li>'+
    '<li><b>音樂</b>：以電子音樂為主，每期一個具體的細節。</li>'+
    '<li><b>百千</b>：侯百千自己寫的一篇作品。</li></ul>'+
    '<p>另外三欄輪流，每期一篇：<b>文學</b>、<b>興趣的藝術</b>（畫、占卜與身心靈、電影）、<b>遠方</b>（很遠的地方發生的真事）。</p>'+
    '<p>每天清晨出一期，每一期都有結尾。希望讀完的時候，眼界比讀之前大一點點。</p></div>';
  const LEGACY_ROTATION = 20; // 只給沒寫 art 的舊期（第 1–11 期）依期數輪流用，固定不改；畫的張數只記在百千報 db 的 meta/editor.art_count，加畫不用改這裡
  function build(x){
    const night = x.edition === 'night', cards = [];
    curId = x.id || '';
    let items = [];
    if(night){ (x.items||[]).forEach((it,i) => { const c = card(it.tag, it.sub, it, 'n'+(i+1)); if(c) items.push(c); }); }
    else {
      const ks = ['news','main','lesson','tattoo','music','own','craft','lit','far'];
      const cs = [card('新聞','值得知道',x.news,'news'), card('主食',x.main&&x.main.label||'反方',x.main,'main'),
       card('主線',x.lesson?(x.lesson.series||'')+(x.lesson.no?'・第 '+x.lesson.no+' 課':''):'',x.lesson,'lesson'),
       card('刺青',x.tattoo&&x.tattoo.topic||'',x.tattoo,'tattoo'), card('音樂',x.music&&x.music.topic||'',x.music,'music'),
       card('百千',x.own&&x.own.kind||'自己寫的',x.own,'own'), card('興趣的藝術',x.craft&&x.craft.domain||'',x.craft,'craft'), card('文學',x.lit&&x.lit.kind||'讀',x.lit,'lit'), card('調味','遠方',x.far,'far')];
      // 期數 JSON 有 order（欄位名陣列）時照它排，沒寫的欄位接在後面；沒有 order 的舊期維持原順序
      const idx = ks.map((k,i)=>i);
      if(Array.isArray(x.order)) idx.sort((i,j)=>{const a=x.order.indexOf(ks[i]),b=x.order.indexOf(ks[j]);return (a<0?99+i:a)-(b<0?99+j:b);});
      idx.forEach(i => cs[i] && items.push(cs[i]));
    }
    const artN = night ? (Number.isInteger(Number(x.art)) && Number(x.art) >= 1 ? Number(x.art) : 0) : (Number.isInteger(Number(x.art)) && Number(x.art) >= 1 ? Number(x.art) : (Number(x.issue_no) > 0 ? ((Number(x.issue_no) - 1) % LEGACY_ROTATION) + 1 : 0)); // 每期 JSON 的 art 欄指定第幾張（寫稿時依 meta/editor.art_notes 挑最適合當期的、一輪不重複）；沒寫的舊期依期數輪
    const artSrc = artN ? 'art/'+String(artN).padStart(2,'0')+'.webp' : '';
    const artHtml = artN ? '<div class="art" role="img" aria-label="侯百千的畫" style="-webkit-mask-image:url('+artSrc+');mask-image:url('+artSrc+')"></div>' : '';
    cards.push('<div class="inner cover">'+artHtml+'<div class="ed">'+(night?'夜　刊':'百 千 報<span class="en">THE HUNDRED</span>')+'</div><div class="date">'+esc(lab(x))+'　'+esc(when(x))+'</div><div class="line">'+esc(x.opening||'')+'</div><div class="toc">'+esc(items.map(c=>c.label).join('・'))+'</div>'+(x.alt&&x.alt.id?'<div class="hint"><a href="p/'+esc(x.alt.id)+'.html">'+esc(x.alt.label||'English')+' →</a></div>':'')+'<div class="hint">往左滑 →</div><div class="home"><a href="../">侯百千・刺青 文字 聲音 →</a></div></div>');
    items.forEach(c => cards.push('<div class="inner">'+c.html+'</div>'));
    if(night && x.sleep) cards.push('<div class="inner cover"><div class="tag"><b>帶進睡眠</b></div><div class="carry">'+esc(x.sleep)+'</div></div>');
    cards.push('<div class="inner end"><div class="big">'+(night?'晚安':'讀完了')+'</div><div class="sub">'+(night?'放下手機吧。':'這一期到這裡。')+'</div>'+
      '<form class="msg" id="msg"><h3>寫信給侯百千</h3>'+'<input type="text" name="name" placeholder="你的名字" required>'+'<input type="email" name="email" placeholder="Email（他會回信到這裡）" required>'+'<textarea name="message" rows="4" placeholder="讀完想說的話、反駁、題目建議都可以" required></textarea>'+'<div class="row"><span class="hintx" id="msghint"></span><button class="btn" type="submit">送出</button></div></form>'+'<div class="past"><h3>往期</h3>'+list.map(y=>'<button data-id="'+esc(y.id)+'" class="'+(y.id===x.id?'on':'')+'">'+esc(lab(y))+(y.special&&y.title===y.special?'':'　'+esc((y.edition==='night'?'夜刊・':'')+(y.title||'')))+'<span>'+esc(when(y))+'</span></button>').join('')+'</div>'+
      '<div class="credit"><a href="../">侯百千</a>主編、發行，AI 協作的刊物。<br>一期一期出，讀完會結束。<br><a href="archive.html">所有期數（文字版）</a>・<a href="tags.html">標籤索引</a>・<a href="feed.xml">RSS 訂閱</a>・<a href="../">到侯百千的主頁 →</a><br>© 侯百千。歡迎附上原文連結分享、引用；轉載全文或商業使用請先來信。</div></div>');
    cards.push('<div class="inner intro">'+INTRO+'</div>');
    deck.innerHTML = cards.map(h => '<section class="card">'+h+'</section>').join('');
    bars.innerHTML = cards.map(()=>'<i></i>').join('');
    deck.scrollLeft = 0; mark(0);
    document.body.classList.toggle('night', night);
    issueEl.textContent = lab(x);
    deck.querySelectorAll('.past button').forEach(b => b.onclick = () => open(b.dataset.id, true));
    const f = document.getElementById('msg'), hint = document.getElementById('msghint');
    if(f) f.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(f);
      fd.append('_subject', '百千報讀者來信（'+lab(x)+'）');
      fd.append('issue', lab(x)+' '+(x.id||''));
      hint.textContent = '送出中⋯';
      try{
        const r = await fetch('https://formspree.io/f/mreyadad', {method:'POST', body:fd, headers:{'Accept':'application/json'}});
        if(r.ok){ f.reset(); hint.textContent = '收到了，謝謝你。'; } else hint.textContent = '沒送出，稍後再試，或寄信到 monbaician@gmail.com';
      }catch(err){ hint.textContent = '沒送出，稍後再試，或寄信到 monbaician@gmail.com'; }
    };
  }
  function mark(i){ bars.querySelectorAll('i').forEach((b,k)=>{ b.className = k<i?'done':(k===i?'on':''); }); const c = deck.children[i]; if(c && window.hundredStoryPreload) window.hundredStoryPreload(c); } // 翻到哪張就預載那張的限動圖
  const idx = () => Math.round(deck.scrollLeft / deck.clientWidth);
  deck.addEventListener('scroll', () => mark(idx()), {passive:true});
  const go = d => deck.scrollTo({left:(idx()+d)*deck.clientWidth, behavior:'smooth'});
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.addEventListener('keydown', e => { if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
  const lab = y => y.special ? '特輯・'+y.special : '第 '+y.issue_no+' 期'; // 特輯不佔期數
  const fail = m => { deck.innerHTML = '<section class="card"><div class="state">'+m+'</div></section>'; };
  async function open(id, push){
    try{
      const x = cache[id] || (cache[id] = await (await fetch('issues/'+encodeURIComponent(id)+'.json', {cache:'no-cache'})).json());
      x.id = id; cur = id; build(x);
      if(push) history.replaceState(null,'','#'+id);
    }catch(e){ fail('這一期讀不到，稍後再試。'); }
  }
  (async () => {
    try{
      list = (await (await fetch('issues/index.json', {cache:'no-cache'})).json()).issues || [];
      list = list.filter(y=>y.lang!=='en'); // 英文版只有文字頁，不進滑卡
      list.sort((a,b) => String(b.published).localeCompare(String(a.published)));
      if(!list.length) return fail('第一期還在準備。');
      const want = location.hash.slice(1);
      const reg = list.filter(y=>!y.special); // 特輯（special）不當首頁，只能從網址或往期進入
      open(list.some(y=>y.id===want) ? want : (reg[0]||list[0]).id, false);
    }catch(e){ fail('現在讀不到內容，稍後再打開一次。'); }
  })();
})();
</script>
</body>
