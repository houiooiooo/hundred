<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百千報 — 侯百千</title>
<meta name="description" content="百千報：一期一期出的白話小報。新聞、反方、意識科學、刺青、電子音樂、百千，加上輪流出的文學、興趣的藝術與遠方。">
<meta property="og:title" content="百千報">
<meta property="og:description" content="一期一期出的白話小報：新聞、反方、意識科學、刺青、電子音樂、百千，加上輪流出的文學、興趣的藝術與遠方。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://houiooiooo.github.io/hundred/news/">
<meta property="og:image" content="https://houiooiooo.github.io/hundred/img/studio-wall.jpeg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f4f0e8; --ink:#1b1a18; --ink2:#55514a; --ink3:#8d877c; --line:#d9d2c4; --seal:#b0342a; --card:#fbf8f2; }
  @media (prefers-color-scheme: dark){ :root{ --paper:#121110; --ink:#ebe6dc; --ink2:#b3ac9f; --ink3:#7a7469; --line:#2c2a26; --seal:#d0574a; --card:#1a1917; } }
  body.night{ --paper:#0e0e10; --ink:#e4e0d6; --ink2:#a9a397; --ink3:#6e6a62; --line:#25242a; --seal:#c9a35a; --card:#17171b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
  body{font-family:"Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;transition:background .3s}
  .top{position:fixed;top:0;left:0;right:0;z-index:5;padding:10px 16px 8px;background:linear-gradient(var(--paper) 70%,transparent)}
  .bars{display:flex;gap:4px;max-width:640px;margin:0 auto 8px}
  .bars i{flex:1;height:3px;border-radius:2px;background:var(--line)}
  .bars i.done{background:var(--ink2)} .bars i.on{background:var(--seal)}
  .head{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
  .brand{font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;letter-spacing:.12em}
  .issue{font-size:12px;color:var(--ink3);letter-spacing:.08em}
  .deck{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
  .deck::-webkit-scrollbar{display:none}
  .card{flex:0 0 100%;height:100%;scroll-snap-align:start;overflow-y:auto;padding:84px 22px 60px}
  .inner{max-width:600px;margin:0 auto}
  .tag{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .tag b{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;color:var(--seal);letter-spacing:.18em}
  .tag span{font-size:12px;color:var(--ink3);letter-spacing:.06em}
  h2{font-family:"Noto Serif TC",serif;font-weight:600;font-size:23px;line-height:1.5;margin:0 0 14px}
  .target{font-size:13px;color:var(--ink2);border-left:2px solid var(--seal);padding-left:10px;margin:0 0 14px}
  .body p{margin:0 0 14px}
  sup.fn{color:var(--seal);font-size:11px;margin-left:1px;font-weight:600}
  .bg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px 2px;margin:20px 0 8px;font-size:15px;color:var(--ink2)}
  .bg .bgt{font-family:"Noto Serif TC",serif;font-weight:600;color:var(--ink);margin-bottom:8px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:8px;font-family:"Noto Serif TC",serif}
  .q::before{content:"問　";color:var(--seal);font-weight:900}
  details{margin-top:14px}
  details>summary{cursor:pointer;color:var(--ink3);font-size:13px;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details.notes{border-top:1px dashed var(--line);padding-top:8px}
  details.notes ol{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.75;color:var(--ink2)}
  details.notes li{margin-bottom:8px}
  details.more>summary{color:var(--seal);font-size:14px}
  .src{font-size:13px;color:var(--ink3);margin-top:10px} .src a{color:var(--ink2)}
  .cover{display:flex;flex-direction:column;justify-content:center;min-height:calc(100% - 40px)}
  .cover .ed{font-family:"Noto Serif TC",serif;font-size:14px;color:var(--seal);letter-spacing:.3em}
  .cover .date{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink2);margin:6px 0 26px}
  .cover .line{font-family:"Noto Serif TC",serif;font-weight:600;font-size:27px;line-height:1.6}
  .cover .toc{margin-top:34px;font-size:14px;color:var(--ink3);line-height:2}
  .cover .home{margin-top:18px;font-size:13px;letter-spacing:.12em}
  .cover .home a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
  .cover .hint{margin-top:30px;font-size:12px;color:var(--ink3);letter-spacing:.15em}
  .carry{text-align:center;font-family:"Noto Serif TC",serif;font-size:21px;line-height:1.75;padding:30px 0}
  .end{text-align:center}
  .end .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;margin:10px 0 6px}
  .end .sub{color:var(--ink3);font-size:14px;margin-bottom:30px}
  .reply{text-align:left;margin-top:10px}
  textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;resize:vertical}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
  .hintx{font-size:12px;color:var(--ink3)}
  .btn{font:inherit;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 18px;cursor:pointer}
  .past{margin-top:36px;text-align:left}
  .past h3{font-family:"Noto Serif TC",serif;font-size:13px;color:var(--ink3);font-weight:400;letter-spacing:.2em;margin:0 0 8px;text-align:center}
  .past button{display:flex;justify-content:space-between;width:100%;font:inherit;font-size:14px;background:transparent;color:var(--ink2);border:0;border-bottom:1px solid var(--line);padding:8px 2px;cursor:pointer;text-align:left}
  .past button span{color:var(--ink3);font-size:12px;white-space:nowrap;margin-left:10px}
  .past button.on{color:var(--seal)}
  .nav{position:fixed;top:60px;bottom:0;width:18%;z-index:3;background:transparent;border:0;cursor:pointer}
  .nav.l{left:0} .nav.r{right:0}
  @media (hover:none){ .nav{display:none} }
  .msg{text-align:left;margin:6px 0 30px}
  .msg h3{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:600;margin:0 0 10px;color:var(--ink)}
  .msg input,.msg textarea{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:9px 12px;margin-bottom:10px}
  .msg textarea{resize:vertical}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hintx{font-size:12px;color:var(--ink3)}
  .btn{font:inherit;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 18px;cursor:pointer}
  .credit{margin-top:28px;font-size:12px;color:var(--ink3);line-height:1.8;text-align:center}
  .credit a{color:var(--ink2)}
  .state{display:grid;place-items:center;height:100%;color:var(--ink3)}
  .intro ul{margin:0 0 14px;padding-left:20px}
  .intro li{margin-bottom:8px}
  .intro li b{color:var(--seal);font-weight:600}
</style>
<link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" type="image/png" href="../icon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>
<div class="top">
  <div class="bars" id="bars"></div>
  <div class="head"><a class="brand" href="../" style="color:inherit;text-decoration:none">百千報</a><div class="issue" id="issue"></div></div>
</div>
<div class="deck" id="deck"><section class="card"><div class="state">載入中⋯</div></section></div>
<button class="nav l" id="prev" aria-label="上一張"></button>
<button class="nav r" id="next" aria-label="下一張"></button>
<script>
(function(){
  const deck = document.getElementById('deck'), bars = document.getElementById('bars'), issueEl = document.getElementById('issue');
  let list = [], cur = null, cache = {};
  const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paras = s => String(s ?? '').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p>'+esc(p).replace(/\n/g,'<br>').replace(/\[(\d{1,2})\]/g,'<sup class="fn">$1</sup>')+'</p>').join('');
  const bodyHtml = s => {
    const ps = String(s ?? '').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    const i = ps.findIndex(p => /^背景｜/.test(p));
    if(i < 0) return '<div class="body">'+paras(s)+'</div>';
    const head = esc(ps[i]).replace(/\[(\d{1,2})\]/g,'<sup class="fn">$1</sup>');
    return '<div class="body">'+paras(ps.slice(0,i).join('\n\n'))+'</div><aside class="bg"><div class="bgt">'+head+'</div><div class="body">'+paras(ps.slice(i+1).join('\n\n'))+'</div></aside>';
  };
  const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : null;
  function when(x){
    const p = x.published ? new Date(x.published) : null;
    if(!p || isNaN(p)) return x.date || '';
    const t = new Date(p.getTime() + (8*60 + p.getTimezoneOffset())*60000); // 台北時間
    return (t.getMonth()+1)+'月'+t.getDate()+'日 '+WD[t.getDay()]+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  }
  function card(label, sub, o){
    if(!o) return null;
    let h = '<div class="tag"><b>'+esc(label)+'</b><span>'+esc(sub||'')+'</span></div>';
    if(o.title) h += '<h2>'+esc(o.title)+'</h2>';
    if(o.target) h += '<div class="target">'+esc(o.target)+'</div>';
    h += bodyHtml(o.body);
    if(o.question) h += '<div class="q">'+esc(o.question)+'</div>';
    if(Array.isArray(o.notes) && o.notes.length)
      h += '<details class="notes"><summary>附註（'+o.notes.length+'）</summary><ol>'+o.notes.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></details>';
    const u = o.source && safeUrl(o.source.url);
    if(u) h += '<div class="src">來源：<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(o.source.title||u)+'</a></div>';
    return {label, html:h};
  }
  const INTRO = '<div class="tag"><b>楔子</b><span>關於百千報</span></div><div class="body">'+
    '<p>百千報是一個小小的嘗試：用一份報紙，換掉早上醒來和睡前滑手機的那段時間。</p>'+
    '<p>社群媒體很懂我們喜歡什麼，所以很容易一滑就停不下來，看到的也多半是本來就同意的東西。我們自己也是這樣。</p>'+
    '<p>百千報想試試另一種方式：挑一些可能沒聽過、不一定同意，或從沒想過的東西，放在一起讀。它不一定每次都挑對，也可能寫錯，歡迎寫信來指正。</p>'+
    '<p>每一期有這幾樣：</p><ul>'+
    '<li><b>新聞</b>：一則值得知道的事，說清楚發生了什麼、為什麼重要。</li>'+
    '<li><b>反方</b>：挑一個常見的信念，整理反對它的有力論點，也公平地講支持的一方怎麼回應。</li>'+
    '<li><b>意識科學</b>：一堂一路往下講的課，談「意識是什麼」。</li>'+
    '<li><b>刺青</b>：刺青的傳統、工具、方法與身體，每期一個具體的細節。</li>'+
    '<li><b>電子音樂</b>：電子與實驗音樂的歷史、場景、製作與唱片，每期一個具體的細節。</li>'+
    '<li><b>百千</b>：侯百千自己寫的一篇作品。</li>'+
    '<li>另外三樣輪流，每期一篇：<b>文學</b>（一首詩、一本書，或一位作家怎麼寫作）、<b>興趣的藝術</b>（繪畫、心理學與塔羅和占星工具、電影、車的一個具體細節）、<b>遠方</b>（一件發生在很遠地方的真實新事）。</li></ul>'+
    '<p>每天清晨出一期，每一期都有結尾。希望讀完的時候，眼界比讀之前大一點點。</p></div>';
  function build(x){
    const night = x.edition === 'night', cards = [];
    let items = [];
    if(night){ (x.items||[]).forEach(it => { const c = card(it.tag, it.sub, it); if(c) items.push(c); }); }
    else {
      const ks = ['news','main','lesson','tattoo','music','own','craft','lit','far'];
      const cs = [card('新聞','值得知道',x.news), card('主食','反方',x.main),
       card('主線',x.lesson?(x.lesson.series||'')+(x.lesson.no?'・第 '+x.lesson.no+' 課':''):'',x.lesson),
       card('刺青',x.tattoo&&x.tattoo.topic||'',x.tattoo), card('電子音樂',x.music&&x.music.topic||'',x.music),
       card('百千',x.own&&x.own.kind||'自己寫的',x.own), card('興趣的藝術',x.craft&&x.craft.domain||'',x.craft), card('文學',x.lit&&x.lit.kind||'讀',x.lit), card('調味','遠方',x.far)];
      // 期數 JSON 有 order（欄位名陣列）時照它排，沒寫的欄位接在後面；沒有 order 的舊期維持原順序
      const idx = ks.map((k,i)=>i);
      if(Array.isArray(x.order)) idx.sort((i,j)=>{const a=x.order.indexOf(ks[i]),b=x.order.indexOf(ks[j]);return (a<0?99+i:a)-(b<0?99+j:b);});
      idx.forEach(i => cs[i] && items.push(cs[i]));
    }
    cards.push('<div class="inner cover"><div class="ed">'+(night?'夜　刊':'百 千 報')+'</div><div class="date">第 '+esc(x.issue_no)+' 期　'+esc(when(x))+'</div><div class="line">'+esc(x.opening||'')+'</div><div class="toc">'+esc(items.map(c=>c.label).join('・'))+'</div><div class="hint">往左滑 →</div><div class="home"><a href="../">侯百千・刺青 文字 聲音 →</a></div></div>');
    items.forEach(c => cards.push('<div class="inner">'+c.html+'</div>'));
    if(night && x.sleep) cards.push('<div class="inner cover"><div class="tag"><b>帶進睡眠</b></div><div class="carry">'+esc(x.sleep)+'</div></div>');
    cards.push('<div class="inner end"><div class="big">'+(night?'晚安':'讀完了')+'</div><div class="sub">'+(night?'放下手機吧。':'這一期到這裡。')+'</div>'+
      '<form class="msg" id="msg"><h3>寫信給侯百千</h3>'+'<input type="text" name="name" placeholder="你的名字" required>'+'<input type="email" name="email" placeholder="Email（他會回信到這裡）" required>'+'<textarea name="message" rows="4" placeholder="讀完想說的話、反駁、題目建議都可以" required></textarea>'+'<div class="row"><span class="hintx" id="msghint"></span><button class="btn" type="submit">送出</button></div></form>'+'<div class="past"><h3>往期</h3>'+list.map(y=>'<button data-id="'+esc(y.id)+'" class="'+(y.id===x.id?'on':'')+'">第 '+esc(y.issue_no)+' 期　'+esc((y.edition==='night'?'夜刊・':'')+(y.title||''))+'<span>'+esc(when(y))+'</span></button>').join('')+'</div>'+
      '<div class="credit">百千報由 AI 協作撰寫，<a href="../">侯百千</a>主編並發行。<br>一期一期出，讀完會結束。<br><a href="archive.html">所有期數（文字版）</a>・<a href="../">到侯百千的主頁 →</a></div></div>');
    cards.push('<div class="inner intro">'+INTRO+'</div>');
    deck.innerHTML = cards.map(h => '<section class="card">'+h+'</section>').join('');
    bars.innerHTML = cards.map(()=>'<i></i>').join('');
    deck.scrollLeft = 0; mark(0);
    document.body.classList.toggle('night', night);
    issueEl.textContent = '第 '+x.issue_no+' 期';
    deck.querySelectorAll('.past button').forEach(b => b.onclick = () => open(b.dataset.id, true));
    const f = document.getElementById('msg'), hint = document.getElementById('msghint');
    if(f) f.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(f);
      fd.append('_subject', '百千報讀者來信（第 '+x.issue_no+' 期）');
      fd.append('issue', '第 '+x.issue_no+' 期 '+(x.id||''));
      hint.textContent = '送出中⋯';
      try{
        const r = await fetch('https://formspree.io/f/mreyadad', {method:'POST', body:fd, headers:{'Accept':'application/json'}});
        if(r.ok){ f.reset(); hint.textContent = '收到了，謝謝你。'; } else hint.textContent = '沒送出，稍後再試，或寄信到 monbaician@gmail.com';
      }catch(err){ hint.textContent = '沒送出，稍後再試，或寄信到 monbaician@gmail.com'; }
    };
  }
  function mark(i){ bars.querySelectorAll('i').forEach((b,k)=>{ b.className = k<i?'done':(k===i?'on':''); }); }
  const idx = () => Math.round(deck.scrollLeft / deck.clientWidth);
  deck.addEventListener('scroll', () => mark(idx()), {passive:true});
  const go = d => deck.scrollTo({left:(idx()+d)*deck.clientWidth, behavior:'smooth'});
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.addEventListener('keydown', e => { if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
  const fail = m => { deck.innerHTML = '<section class="card"><div class="state">'+m+'</div></section>'; };
  async function open(id, push){
    try{
      const x = cache[id] || (cache[id] = await (await fetch('issues/'+encodeURIComponent(id)+'.json', {cache:'no-cache'})).json());
      x.id = id; cur = id; build(x);
      if(push) history.replaceState(null,'','#'+id);
    }catch(e){ fail('這一期讀不到，稍後再試。'); }
  }
  (async () => {
    try{
      list = (await (await fetch('issues/index.json', {cache:'no-cache'})).json()).issues || [];
      list.sort((a,b) => String(b.published).localeCompare(String(a.published)));
      if(!list.length) return fail('第一期還在準備。');
      const want = location.hash.slice(1);
      open(list.some(y=>y.id===want) ? want : list[0].id, false);
    }catch(e){ fail('現在讀不到內容，稍後再打開一次。'); }
  })();
})();
</script>
</body>
</html>
